keymap:
  - name: Obsidian — gtk-like keybindings
    exact_match: true
    application:
      only: ["/obsidian/", "/superproductivity/"]
    remap:
      Shift-Alt-Left: Ctrl-Shift-Left
      Shift-Alt-Right: Ctrl-Shift-Right
      Shift-Alt-Up: [Shift-Up, Shift-Home]
      Shift-Alt-Down: [Shift-Down, Shift-End]
      Shift-Ctrl-Left: Shift-Home
      Shift-Ctrl-Right: Shift-End
      Shift-Ctrl-Up: Ctrl-Shift-Home
      Shift-Ctrl-Down: Ctrl-Shift-End
      Alt-Left: Ctrl-Left
      Alt-Right: Ctrl-Right
      Alt-Up: [Up, Home]
      Alt-Down: [Down, End]
      Ctrl-Left: Home
      Ctrl-Right: End
      Ctrl-Up: Ctrl-Home
      Ctrl-Down: Ctrl-End
      Alt-BackSpace: Ctrl-BackSpace
      Alt-Delete: Ctrl-Delete
      Ctrl-BackSpace: [Shift-Home, BackSpace]

  - name: Ctrl+Backspace — delete to line start, or newline if at BOL (all apps except kitty)
    exact_match: true
    application:
      not: [/kitty/, /obsidian/]
    remap:
      Ctrl-BackSpace: [Shift-Home, BackSpace]

  - name: Win+C/V/X/Z → Ctrl+C/V/X/Z (all apps except kitty)
    exact_match: true
    application:
      not: [/kitty/]
    remap:
      Super-c: Ctrl-c
      Super-v: Ctrl-v
      Super-x: Ctrl-x
      Super-z: Ctrl-z
      Super-a: Ctrl-a
      Shift-Super-z: Ctrl-Shift-z

  - name: Disable Ctrl+C/V/X/Z copy-paste/cut/undo (all apps except kitty)
    exact_match: true
    application:
      not: [/kitty/]
    remap:
      Ctrl-c: []
      Ctrl-v: []
      Ctrl-x: []
      Ctrl-z: []
      Ctrl-a: []
      Ctrl-Shift-z: []
