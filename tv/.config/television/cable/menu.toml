[metadata]
name = "menu"
description = "Main menu: brightness, clipboard, downloads, edit text, edit config/obsidian, translate, web search, volume, wifi, removable media"
requirements = ["tv", "kitty", "xclip", "xsel", "clipcatctl"]

[source]
command = "printf '%s\\n' 'brightness' 'Clipboard' 'Downloads' 'Edit text' 'Edit config' 'Edit obsidian' 'Translate' 'Web search' 'Volume control' 'wifi' 'Removable media'"
no_sort = true
frecency = false

[keybindings]
enter = "actions:run"

[ui.preview_panel]
hidden = true

[ui.status_bar]
hidden = true

# Interactive follow-ups (a tv channel, a prompt) are queued into the prewarmed
# menu window instead of opening another kitty: the window is already visible,
# so menu -> brightness -> ... stays in one window and is hidden again when the
# last step exits. Anything that outlives the menu (an editor, GTK apps) gets
# its own window instead - via the script that runs the last menu step, since a
# follow-up queued with --send would be run by the menu window itself.
[actions.run]
description = "Run the selected menu entry"
command = '''
MENU="$HOME/.config/awesome/scripts/menu"
EDIT_FILE="$HOME/.config/television/scripts/edit-file.sh"
case '{}' in
  brightness)
    "$MENU" --send "tv brightness" ;;
  Clipboard)
    "$MENU" --send "tv clipboard" ;;
  Downloads)
    "$MENU" --send "tv downloads" ;;
  "Edit text")
    "$MENU" --send "$HOME/.config/television/scripts/edit-clip.sh" ;;
  "Edit config")
    "$MENU" --send "$EDIT_FILE dirs-config" ;;
  "Edit obsidian")
    "$MENU" --send "$EDIT_FILE files-obsidian" ;;
  "Translate")
    "$MENU" --send "$HOME/.config/television/scripts/translate.sh" ;;
  "Web search")
    "$MENU" --send "$HOME/.config/television/scripts/web-search.sh" ;;
  "Volume control")
    (trap '' HUP; setsid ${TERMINAL:-kitty} --class pulsemixer -e "$HOME/Desktop/pulsemixer" </dev/null >/dev/null 2>&1 &) ;;
  wifi)
    (trap '' HUP; setsid ${TERMINAL:-kitty} --class wlctl -e wlctl </dev/null >/dev/null 2>&1 &) ;;
  "Removable media")
    "$MENU" --send "tv media" ;;
esac
'''
shell = "bash"
mode = "execute"
