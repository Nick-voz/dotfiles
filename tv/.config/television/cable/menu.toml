[metadata]
name = "menu"
description = "Main menu: brightness, clipboard, edit text, edit config/obsidian, web search, volume, wifi, removable media"
requirements = ["tv", "kitty", "xclip", "xsel", "clipcatctl"]

[source]
command = "printf '%s\\n' 'brightness' 'Clipboard' 'Edit text' 'Edit config' 'Edit obsidian' 'Web search' 'Volume control' 'wifi' 'Removable media'"
no_sort = true
frecency = false

[keybindings]
enter = "actions:run"

[ui.preview_panel]
hidden = true

# Interactive follow-ups (a tv channel, nvim, a prompt) are queued into the
# prewarmed menu window instead of opening another kitty: the window is already
# visible, so menu -> brightness -> ... stays in one window and is hidden again
# when the last step exits. Anything that needs its own X window (GTK apps)
# still gets a throwaway terminal.
[actions.run]
description = "Run the selected menu entry"
command = '''
MENU="$HOME/.config/awesome/scripts/menu"
case '{}' in
  brightness)
    "$MENU" --send "tv brightness" ;;
  Clipboard)
    "$MENU" --send "tv clipboard" ;;
  "Edit text")
    "$MENU" --send "$HOME/.config/television/scripts/edit-clip.sh" ;;
  "Edit config")
    "$MENU" --send "tv dirs-config && ${EDITOR:-nvim} \"\$(xclip -selection secondary -out)\"" ;;
  "Edit obsidian")
    "$MENU" --send "tv files-obsidian && ${EDITOR:-nvim} \"\$(xclip -selection secondary -out)\"" ;;
  "Web search")
    "$MENU" --send "$HOME/.config/television/scripts/web-search.sh" ;;
  "Volume control")
    (trap '' HUP; setsid ${TERMINAL:-kitty} --class pulsemixer -e "$HOME/Desktop/pulsemixer" </dev/null >/dev/null 2>&1 &) ;;
  wifi)
    (trap '' HUP; setsid ${TERMINAL:-kitty} --class wlctl -e wlctl </dev/null >/dev/null 2>&1 &) ;;
  "Removable media")
    "$MENU" --send "tv media" ;;
esac
'''
shell = "bash"
mode = "execute"
