[metadata]
name = "apps"
description = "Application launcher: desktop entries"
requirements = ["bash", "gio"]

[source]
command = "\"$HOME/.config/television/scripts/apps-list.sh\""
display = "{split:\\t:0}"

[preview]
command = "\"$HOME/.config/television/scripts/apps-preview.sh\" '{split:\\t:1}'"

[ui.preview_panel]
header = "{split:\\t:0}"

[ui.status_bar]
hidden = true

[keybindings]
enter = "actions:launch"

[actions.launch]
description = "Launch the selected application detached"
command = "\"$HOME/.config/television/scripts/apps-launch.sh\" '{split:\\t:1}'"
mode = "execute"
