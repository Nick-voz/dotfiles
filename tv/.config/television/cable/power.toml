[metadata]
name = "power"
description = "Power menu: update, shutdown, reboot, suspend, logout"
requirements = ["systemctl"]

[source]
command = "printf '%s\\n' 'Sleep' 'Reboot' 'Update' 'Logout' 'Shutdown'"
no_sort = true
frecency = false

[keybindings]
enter = "actions:run"

[ui.preview_panel]
hidden = true

[ui.status_bar]
hidden = true

[actions.run]
description = "Run selected power action"
command = '''
case '{}' in
  Update) "$HOME/.config/television/scripts/update-window.sh" ;;
  Shutdown) systemctl poweroff ;;
  Reboot) systemctl reboot ;;
  Sleep) systemctl suspend ;;
  Logout) fish -c 'logout' ;;
esac
'''
shell = "bash"
mode = "execute"
