[metadata]
name = "dirs-config"
description = "A channel to select from config directories"
requirements = ["fd"]

[source]
command = "fd -t d --max-depth 4 . $HOME/.config $HOME/dotfiles"

[preview]
command = '''
target=$("$HOME/.config/television/scripts/stow-target.sh" '{}')
printf '%s\n' "$target"
ls -la --color=always "$target"
'''
shell = "bash"

[keybindings]
shortcut = "f2"
enter = "actions:open"

[actions.open]
description = "Copy selected path to clipboard"
command = "printf '%s' '{}' | xsel --secondary --input"
shell = "bash"
mode = "execute"
