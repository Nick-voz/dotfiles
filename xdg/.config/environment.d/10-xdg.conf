# Managed by dotfiles (`stow xdg`).
# NOTE: no XDG_* here on purpose: when unset, systemd/GLib/Qt all default
# to ~/.config, ~/.local/share, etc. Literal values would need an absolute
# $HOME (environment.d has no shell expansion; systemd leaves %h
# unexpanded in the user-manager environment, which silently breaks
# D-Bus-activated services such as dconf-service). Shells get explicit
# XDG exports from ~/.profile instead.
QT_QPA_PLATFORMTHEME=gtk3
